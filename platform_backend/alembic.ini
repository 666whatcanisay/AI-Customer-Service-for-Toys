[alembic]
script_location = migrations
prepend_sys_path = .
# Deliberately unusable without an explicit DATABASE_URL or programmatic
# override.  Migration commands must never create ./platform.db implicitly.
sqlalchemy.url = driver://explicit-database-url-required

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
