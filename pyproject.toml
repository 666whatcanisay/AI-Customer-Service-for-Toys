[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cs-channel-execution-engine"
version = "0.2.0rc3"
description = "Clean-room channel execution foundation for AI-CS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "AI-CS Engineering" }]
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.51",
  "uvicorn==0.52.0",
  "websocket-client==1.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
]

[project.scripts]
channel-engine = "channel_engine.production_app:run"
channel-agent = "channel_agent.app:main"
channel-agent-foundation = "channel_agent.app:main"
channel-agent-windows = "channel_agent.windows_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["channel_engine"]
branch = true
