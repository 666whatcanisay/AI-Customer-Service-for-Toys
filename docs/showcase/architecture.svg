<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">AI-CS Knowledge Lifecycle Architecture</title>
  <desc id="desc">Excel flows through Knowledge Management, AI Publishing, Vector Database, RAG and Customer Assistant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EEF5FF"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2457A6"/>
      <stop offset="1" stop-color="#3979DB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173A70" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7395C7"/>
    </marker>
  </defs>
  <rect width="1440" height="360" rx="28" fill="url(#bg)"/>
  <text x="70" y="62" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#102A56">AI-CS Knowledge Lifecycle</text>
  <text x="70" y="94" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#587098">Auditable · Incremental · Human reviewed</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="70" y="145" width="180" height="120" rx="20" fill="#FFFFFF" stroke="#D6E3F6"/>
      <circle cx="160" cy="177" r="18" fill="#E8F1FF"/>
      <text x="160" y="183" font-size="17" font-weight="700" fill="#2457A6">XLSX</text>
      <text x="160" y="222" font-size="20" font-weight="700" fill="#142B4F">Excel</text>
      <text x="160" y="246" font-size="13" fill="#6A7F9F">Fixed templates</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="295" y="145" width="190" height="120" rx="20" fill="#FFFFFF" stroke="#D6E3F6"/>
      <text x="390" y="194" font-size="19" font-weight="700" fill="#142B4F">Knowledge</text>
      <text x="390" y="219" font-size="19" font-weight="700" fill="#142B4F">Management</text>
      <text x="390" y="246" font-size="13" fill="#6A7F9F">Validate · Merge · Review</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="530" y="145" width="180" height="120" rx="20" fill="url(#primary)"/>
      <text x="620" y="199" font-size="19" font-weight="700" fill="#FFFFFF">AI Publishing</text>
      <text x="620" y="230" font-size="13" fill="#DCE9FF">Document · Chunk · Embed</text>
      <text x="620" y="251" font-size="13" fill="#DCE9FF">Publication receipt</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="755" y="145" width="180" height="120" rx="20" fill="#FFFFFF" stroke="#D6E3F6"/>
      <text x="845" y="200" font-size="19" font-weight="700" fill="#142B4F">Vector Database</text>
      <text x="845" y="231" font-size="13" fill="#6A7F9F">Product-scoped vectors</text>
      <text x="845" y="251" font-size="13" fill="#6A7F9F">Incremental updates</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="980" y="145" width="160" height="120" rx="20" fill="#FFFFFF" stroke="#D6E3F6"/>
      <circle cx="1060" cy="183" r="21" fill="#E9F8F3"/>
      <text x="1060" y="190" font-size="18" font-weight="700" fill="#087A5B">RAG</text>
      <text x="1060" y="226" font-size="13" fill="#6A7F9F">Retrieve evidence</text>
      <text x="1060" y="247" font-size="13" fill="#6A7F9F">Generate suggestion</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1185" y="145" width="185" height="120" rx="20" fill="#102A56"/>
      <text x="1277" y="199" font-size="19" font-weight="700" fill="#FFFFFF">Customer</text>
      <text x="1277" y="223" font-size="19" font-weight="700" fill="#FFFFFF">Assistant</text>
      <text x="1277" y="250" font-size="13" fill="#C9D8F3">Human confirmation</text>
    </g>
  </g>

  <g stroke="#7395C7" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M250 205 H282"/>
    <path d="M485 205 H517"/>
    <path d="M710 205 H742"/>
    <path d="M935 205 H967"/>
    <path d="M1140 205 H1172"/>
  </g>
</svg>
