name: Frontend build
on:
  pull_request:
    paths: ['frontend/**']
  push:
    paths: ['frontend/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend security gate
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Frontend tests, types, and production build
        working-directory: frontend
        run: |
          npm test
          npm run typecheck
          npm run build
