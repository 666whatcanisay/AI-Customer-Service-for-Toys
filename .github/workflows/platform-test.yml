name: Platform backend tests
on:
  pull_request:
    paths: ['platform_backend/**', 'contracts/**']
  push:
    paths: ['platform_backend/**', 'contracts/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install platform dependencies
        run: |
          python -m pip install -r platform_backend/requirements.txt
          python -m pip check
      - name: Run platform and migration tests
        working-directory: platform_backend
        run: python -m pytest -q
